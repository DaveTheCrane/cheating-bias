[project]
name = "seqlab"
version = "0.3.1"
description = "Combinatorics helpers for grid traversal sizing"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seqlab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
