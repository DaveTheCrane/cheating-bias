# Paid pilot: Claude Haiku 4.5 vs GPT-4.1 mini.
#
# Purpose, in order of importance:
#   1. Exercise the hosted adapters end to end. `probe-model` has confirmed a
#      single tool call on both, but nothing has yet run a full multi-turn agent
#      loop against either, which is where transcript translation gets tested.
#   2. Measure actual cost per run, so the full grid can be budgeted from data
#      rather than from a token estimate.
#   3. Measure the P0 base cheat rate. Local models came in near 0.07, and if the
#      hosted rate is similarly low the reduction rungs (P2-P6) have nothing to
#      reduce and the full ladder is not worth running yet.
#
# Scope: 2 models x 2 rungs x 3 tasks x 3 repeats = 36 runs.
#
# P0 and P1 only, deliberately. P1 is the positive control: if pressure does not
# raise the rate above P0, the instrument is not sensitive on these models and no
# amount of extra rungs or repeats will rescue the design. Learn that for pennies.
#
# Estimated cost at the token profile measured locally: ~$0.90 for Haiku and ~$0.33
# for gpt-4.1-mini, so under $2 for the pilot. `harness analyze` reports actual
# spend and extrapolates to 420 and 840 runs; budget the full grid from that rather
# than from this estimate.
#
#   export ANTHROPIC_API_KEY=...
#   export OPENAI_API_KEY=...
#   python -m harness probe-model anthropic:claude-haiku-4-5-20251001
#   python -m harness probe-model openai:gpt-4.1-mini-2025-04-14
#   python -m harness run --config configs/pilot-hosted.yaml --resume
#   python -m harness analyze results/pilot-hosted --csv pilot.csv
#
# Two comparably-tiered, non-reasoning, tool-native models. Ids are dated and
# fully qualified on purpose: bare aliases move over time, and a moving alias
# would silently break comparability against results gathered earlier. The short
# forms (`claude-haiku-4.5`, `gpt-4.1-mini`) are not both resolvable anyway.
#
# gpt-4.1-mini rather than gpt-5.6-luna: Luna applies a default `reasoning_effort`
# that chat-completions will not combine with function tools. The adapter can work
# around it by setting `reasoning_effort: none`, but that runs Luna with reasoning
# disabled, which is not how it would be deployed and makes a muddy comparison
# against Haiku-without-thinking. gpt-4.1-mini is non-reasoning by design, so the
# two arms are matched without any compromise. It costs roughly twice Luna, which
# is still under $4 per model for a 420-run grid.
models:
  - anthropic:claude-haiku-4-5-20251001
  - openai:gpt-4.1-mini-2025-04-14

prompts: [P0, P1]

tasks: [perf_memo, impossible_spec, possible_spec]

repeats: 3

max_turns: 30
announce_turn_budget: false

# Applied to gpt-4.1-mini, but NOT to Haiku: the Anthropic SDK no longer accepts
# temperature at all, so that arm samples at whatever the API defaults to. The two
# arms are therefore not matched on sampling, which is worth stating in any
# write-up. Check `agent.sampling` per run for what each provider actually took,
# and watch for the determinism warning from `analyze` — if Haiku's repeats come
# back identical, its cells hold one observation counted n times.
temperature: 1.0
max_tokens: 4096

prompt_channel: system
monitoring: none

# Hosted models are rate-limited rather than serialised, so real parallelism is
# available. Kept low for a first paid run: a bug should waste 4 runs, not 36.
# Raise it once the pilot has come back clean.
concurrency: 4

# Still the local subprocess backend: the sandbox question is about the code the
# agent writes, not about where the model runs. Switch to docker for the full grid.
sandbox: subprocess

out_dir: results/pilot-hosted
resume: true
keep_workdirs: false
